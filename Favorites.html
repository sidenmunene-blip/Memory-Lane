<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="favorites.css">

<body id="top">
    <header class="page-header">
        <p class="eyebrow">A personal collection</p>
        <h1>Favorite frames</h1>
        <p class="intro">A few moments I keep coming back to: the last light of day, a road in motion, and the machines that make it feel possible.</p>
    </header>

    <main>
        <figure class="featured">
            <img src="https://res.cloudinary.com/hz3gmuqw6/image/upload/c_fill,q_5,w_750,f_auto/v1/classpop/blog/genres-of-photography_6780dbfbd5e47.jpg"
                 alt="Sunset glowing over a natural landscape">
            <figcaption><span class="number">01 / FIRST FRAME</span><span>The first photograph I ever took. I still chase that kind of evening light.</span></figcaption>
        </figure>

        <section class="gallery" aria-label="Favorite car photographs">
            <figure>
                <img src="https://static0.carbuzzimages.com/wordpress/wp-content/uploads/2024/10/04_911_gt3_static.jpg"
                     alt="Porsche 911 GT3 photographed on the road" loading="lazy">
                <figcaption><span class="number">02</span><span>Speed in the shape of a line; the road gives it room to breathe.</span></figcaption>
            </figure>
            <figure>
                <img src="https://wallpapers.com/images/hd/1998-toyota-supra-mk4-on-a-highway-7z6osusef2ms3als.jpg"
                     alt="Toyota Supra Mk4 on a highway" loading="lazy">
                <figcaption><span class="number">03</span><span>A familiar silhouette, stretching into the distance.</span></figcaption>
            </figure>
            <figure>
                <img src="https://tse2.mm.bing.net/th/id/OIP.YTOIsWQxGc2-bgjlatmnWQHaEK?r=0&rs=1&pid=ImgDetMain&o=7&rm=3"
                     alt="Pagani Huayra in the rain" loading="lazy">
                <figcaption><span class="number">04</span><span>Rain turns every surface into a reflection.</span></figcaption>
            </figure>
            <figure>
                <img src="https://img-s-msn-com.akamaized.net/tenant/amp/entityid/AA1YpAxu.img?w=1920&h=1080&m=4&q=93"
                     alt="Lamborghini Huracán waiting at a race track start line" loading="lazy">
                <figcaption><span class="number">05</span><span>The stillness just before the track comes alive.</span></figcaption>
            </figure>
        </section>
    </main>
