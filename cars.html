<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Photography</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>
    <h1><u>Car Photography</u></h1>

    <figure>
        <img src="https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?auto=format&fit=crop&w=1200&q=80" alt="Dark sports car catching the daylight">
        <caption>A clean line of bodywork, revealed by soft afternoon light.</caption>
    </figure>

    <figure>
        <img src="https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=1200&q=80" alt="Sports car on a quiet mountain road">
        <caption>A quiet pause before the road disappears around the bend.</caption>
    </figure>

    <figure>
        <img src="https://thumbs.dreamstime.com/b/car-driving-going-road-motion-blur-car-going-road-countryside-automn-speed-motion-blur-341967633.jpg" alt="Car on an open road">
        <caption>A little motion blur, and the feeling of a long drive home.</caption>
    </figure>

    <figure>
        <img src="https://images.unsplash.com/photo-1544829099-b9a0c07fad1a?auto=format&fit=crop&w=1200&q=80" alt="Close view of a car's sculpted body and wheel">
        <caption>Reflections trace the shape; even at rest, the car seems ready to move.</caption>
    </figure>

    <figure>
        <img src="https://images.unsplash.com/photo-1552519507-da3b142c6e3d?auto=format&fit=crop&w=1200&q=80" alt="Red performance car in warm light">
        <caption>The last sunlight brings out a warmer shade of red.</caption>
    </figure>

    <figure>
        <img src="https://images.unsplash.com/photo-1511919884226-fd3cad34687c?auto=format&fit=crop&w=1200&q=80" alt="Car on an open stretch of road">
        <caption>After the car passes, the road settles back into silence.</caption>
    </figure>
</body>
</html>
